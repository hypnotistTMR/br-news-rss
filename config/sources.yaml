# 🇧🇷 Brasil - Notícias Oficiais & Especializadas
#
# mode:
#   rss  - 公式RSSをそのまま集約
#   api  - 公式JSON/HTML API → Atom生成
#   scrape - HTMLをスクレイプ → Atom生成

version: 2
updated: "2026-10-15"

defaults:
  user_agent: "Mozilla/5.0 (BR-News-RSS-Aggregator; admin@example.com)"
  fetch_interval_minutes: 30
  request_timeout_sec: 20
  max_items_per_feed: 30

